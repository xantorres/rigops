name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: set up python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: tag, versions and the diff from the last candidate
        run: python3 tools/release-check.py "$GITHUB_REF_NAME"

  build:
    needs: [test, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: set up python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: build sdist and wheel
        run: |
          python -m pip install build==1.6.1
          python -m build

      - name: check the wheel
        run: python tools/check-wheel.py dist/*.whl

      - name: write the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          python tools/release-notes.py "$version" > dist-notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/
            dist-notes.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: release/dist
          attestations: true

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if printf '%s' "$GITHUB_REF_NAME" | grep -Eq '(a|b|rc)[0-9]+$'; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file release/dist-notes.md \
            "${flags[@]}" release/dist/*

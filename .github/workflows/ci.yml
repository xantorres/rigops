name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    # ubuntu-latest moved to 26.04, which has no python 3.9 build; the 3.9 floor needs 24.04
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: guard secret
        if: github.event_name == 'push' && !github.event.repository.fork
        env:
          RIGOPS_REDACTION_PATTERNS_B64: ${{ secrets.RIGOPS_REDACTION_PATTERNS_B64 }}
        run: |
          if [ -z "$RIGOPS_REDACTION_PATTERNS_B64" ]; then
            echo "RIGOPS_REDACTION_PATTERNS_B64 repo secret not set; private redaction layer required on push" >&2
            exit 1
          fi

      - name: install ruff
        run: pipx install ruff==0.16.4

      - name: install claude code
        run: npm install -g @anthropic-ai/claude-code

      - name: check
        env:
          RIGOPS_REDACTION_PATTERNS_B64: ${{ secrets.RIGOPS_REDACTION_PATTERNS_B64 }}
        run: make check STRICT=1

      # The runner's default awk may be gawk; the gate must also hold under mawk.
      - name: gate tests under GNU grep and mawk
        env:
          RIGOPS_TEST_EXPECT_AWK: mawk
          RIGOPS_TEST_EXPECT_GREP: GNU grep
        run: |
          mawk_bin="$(command -v mawk)"
          mkdir -p "$RUNNER_TEMP/mawk"
          ln -sf "$mawk_bin" "$RUNNER_TEMP/mawk/awk"
          PATH="$RUNNER_TEMP/mawk:$PATH" python3 -m unittest -v tests.test_tool_flavours tests.test_redaction_gate

  smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v7
        with:
          # py3.9 floor is covered by the lint job; darwin-arm64 lacks 3.9 builds
          python-version: "3.11"

      - run: make test

      - run: make smoke

      - run: make smoke-launchd

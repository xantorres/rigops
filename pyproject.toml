[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rigops"
dynamic = ["version"]
description = "Ops layer for a long-running agent rig: measure whether each tweak worked."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/xantorres/rigops"

[project.scripts]
rigops = "rigops.cli:main"

[tool.setuptools.dynamic]
version = {attr = "rigops.__version__"}

[tool.setuptools.packages.find]
where = ["lib"]
include = ["rigops*"]

[tool.setuptools.package-data]
rigops = ["templates/**/*", "redaction-patterns.public.txt"]
